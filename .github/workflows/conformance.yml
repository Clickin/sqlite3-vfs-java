name: Native SQLite conformance

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: ${{ matrix.os }} / JDK 25
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run cross-process conformance (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw -B --no-transfer-progress verify
      - name: Run cross-process conformance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B --no-transfer-progress verify
      - name: Preserve assertions and environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
