name: Native SQLite conformance

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: ${{ matrix.os }} / JDK 25
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run cross-process conformance (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw -B --no-transfer-progress verify
      - name: Run cross-process conformance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B --no-transfer-progress verify
      - name: Preserve assertions and environment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
