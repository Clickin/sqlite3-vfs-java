vfs.io-methods-version=2 with mapped guest aliases and deterministic JDK unmap; 1 otherwise
vfs.sector-size-fallback=4096
vfs.sector-size-evidence=src/os.h SQLITE_DEFAULT_SECTOR_SIZE; src/os_unix.c setDeviceCharacteristics
vfs.device-characteristics=0
vfs.file-sync=FileChannel.force; FULL requests metadata but cannot promise macOS F_FULLFSYNC
vfs.directory-sync=Strict when requested; default-provider directory open and force; no portable Java guarantee
vfs.windows-journal-sync=File-only, matching winSync; winDelete ignores syncDir but explicit NioVfs.delete(name,true) is strict
vfs.unix-journal-sync=One directory force on first sync of CREATE main-journal, super-journal, or WAL; failures reported rather than ignored
vfs.full-error-mapping=No portable errno ENOSPC; never infer SQLITE_FULL from localized IOException text
vfs.path-limits=Default filesystem, stable paths, one RollbackFile classloader; no concurrent unlink/rename/replacement; hard-link sidecars not interchangeable
vfs.unsupported=Database xFetch mmap, native dynamic extensions, AUTOPROXY, MEMORY opens
vfs.shm-source-algorithms=src/os_unix.c unixShmMap/unixShmLock/unixShmUnmap; src/os_win.c winLockSharedMemory; src/wal.c walIndexTryHdr/walIndexReadHdr/walTryBeginRead/walIndexRecover
vfs.shm-locks=8 lock bytes 120..127, DMS byte 128; nonblocking FileChannel.tryLock; process-local shared-holder aggregation
vfs.shm-mapping=32768-byte MAP_SHARED regions; native little-endian only; each new 4096-byte backing page touched before mapping
vfs.shm-lifetime=One channel per SHM identity in one classloader; last attached reference synchronously invokes JDK-owned cleaner after guest alias detachment
vfs.shm-unmap-runtime=Non-Java-SE dependency jdk.unsupported/sun.misc.Unsafe.invokeCleaner(ByteBuffer), reflectively guarded and probed; no native addresses, application JNI or FFM
vfs.shm-dms=Nonblocking exclusive DMS probe; first-opener truncate; failed probe requires all8 WAL locks then positioned invalidation of header1/fence/header0/fence BEFORE publishing shared DMS, then map and release all8
vfs.shm-dms-rationale=NIO lacks F_GETLK; publishing shared DMS before header invalidation has a crash-before-truncate race; all8 excludes every native transaction and optimistic readers recheck header after reader-lock acquisition
vfs.shm-attach-contention=First JVM attachment may return BUSY while any native transaction holds a WAL byte; retry after transaction ends; attached siblings reuse node without reinitialization
vfs.shm-main-lock=Caller must hold main-database SHARED or stronger during mapping/attachment, preventing last-native-close sidecar deletion before DMS publication
vfs.shm-readonly=NIO cannot prove a live initializer through a read-only channel; explicit SQLITE_READONLY_CANTINIT, no stale-index fallback
vfs.shm-errors=Lock/I/O errors poison node; failed unmap or release retains ownership; ambiguous descriptor close quarantines identity until JVM exit
vfs.shm-delete=Only final detach requests deletion; exclusive DMS probe prevents deleting while another process holds DMS; SQLite caller also serializes against main-database opens
